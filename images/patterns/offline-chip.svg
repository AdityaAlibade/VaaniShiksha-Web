<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <!-- Offline Neural Engine Illustration -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145A32"/>
      <stop offset="100%" stop-color="#0E3D22"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E06D3B"/>
      <stop offset="100%" stop-color="#C85A32"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Radar / Pulse Rings -->
  <circle cx="200" cy="160" r="130" stroke="#145A32" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.25"/>
  <circle cx="200" cy="160" r="100" stroke="#C85A32" stroke-width="1" stroke-dasharray="3 5" stroke-opacity="0.3"/>
  <circle cx="200" cy="160" r="70" stroke="#145A32" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Phone Outline / Micro-Frame -->
  <rect x="135" y="70" width="130" height="200" rx="24" fill="#FFFFFF" stroke="#145A32" stroke-width="3" filter="drop-shadow(0 15px 30px rgba(20,90,50,0.12))"/>
  <!-- Phone Screen Interior -->
  <rect x="143" y="86" width="114" height="168" rx="16" fill="#F4F8F5"/>
  
  <!-- Neural Processor Chip on Screen -->
  <rect x="165" y="115" width="70" height="70" rx="14" fill="url(#shieldGrad)"/>
  
  <!-- Chip Gold Pin Connectors -->
  <line x1="165" y1="130" x2="155" y2="130" stroke="#C85A32" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="165" y1="145" x2="155" y2="145" stroke="#C85A32" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="165" y1="160" x2="155" y2="160" stroke="#C85A32" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="235" y1="130" x2="245" y2="130" stroke="#C85A32" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="235" y1="145" x2="245" y2="145" stroke="#C85A32" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="235" y1="160" x2="245" y2="160" stroke="#C85A32" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Neural Network Nodes inside Chip -->
  <circle cx="185" cy="138" r="4" fill="#FFF"/>
  <circle cx="215" cy="138" r="4" fill="#E06D3B"/>
  <circle cx="200" cy="155" r="5" fill="#58D68D"/>
  <circle cx="185" cy="168" r="3.5" fill="#FFF"/>
  <circle cx="215" cy="168" r="3.5" fill="#FFF"/>

  <line x1="185" y1="138" x2="200" y2="155" stroke="#FFF" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="215" y1="138" x2="200" y2="155" stroke="#FFF" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="185" y1="168" x2="200" y2="155" stroke="#FFF" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="215" y1="168" x2="200" y2="155" stroke="#FFF" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Microphone / Voice Wave Below Chip -->
  <rect x="175" y="196" width="50" height="24" rx="12" fill="#EBF5EE" stroke="#145A32" stroke-width="1.5"/>
  <circle cx="188" cy="208" r="3.5" fill="#145A32"/>
  <path d="M197 205 Q200 202 203 205 T209 205" stroke="#C85A32" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M197 211 Q200 208 203 211 T209 211" stroke="#145A32" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Offline Status Badge Floating Top-Right -->
  <g transform="translate(250, 65)">
    <rect width="115" height="34" rx="17" fill="#FFFFFF" stroke="#E06D3B" stroke-width="1.5" filter="drop-shadow(0 6px 14px rgba(200,90,50,0.18))"/>
    <!-- Slash through cloud or wifi -->
    <path d="M16 17 L28 17 M22 11 L22 23" stroke="#C85A32" stroke-width="2" stroke-linecap="round" transform="rotate(45 22 17)"/>
    <text x="35" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#C85A32">NO CLOUD REQ.</text>
  </g>

  <!-- Local Speed Badge Floating Bottom-Left -->
  <g transform="translate(35, 195)">
    <rect width="125" height="36" rx="18" fill="#FFFFFF" stroke="#145A32" stroke-width="1.5" filter="drop-shadow(0 6px 14px rgba(20,90,50,0.15))"/>
    <circle cx="22" cy="18" r="8" fill="#E5F2EB"/>
    <path d="M18 18 L21 21 L26 15" stroke="#145A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10.5" fill="#145A32">LOCAL INFERENCE</text>
    <text x="38" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8.5" fill="#6A8074">Zero Internet Lag</text>
  </g>
</svg>
