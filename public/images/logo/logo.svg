<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Tribal Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Circle Base -->
    <circle cx="30" cy="30" r="28" fill="#145A32" fill-opacity="0.1" stroke="#145A32" stroke-width="2"/>
    <!-- Tribal Sun & Tree of Wisdom -->
    <path d="M30 10 L30 50 M18 22 L30 30 L42 22 M16 34 L30 40 L44 34" stroke="#D35400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Neural Node Points -->
    <circle cx="30" cy="10" r="3" fill="#D35400"/>
    <circle cx="18" cy="22" r="2.5" fill="#145A32"/>
    <circle cx="42" cy="22" r="2.5" fill="#145A32"/>
    <circle cx="16" cy="34" r="2.5" fill="#145A32"/>
    <circle cx="44" cy="34" r="2.5" fill="#145A32"/>
    <!-- Tribal Chevron Base -->
    <path d="M22 46 L30 42 L38 46" stroke="#D35400" stroke-width="2" stroke-linecap="round"/>
    <circle cx="30" cy="50" r="3" fill="#145A32"/>
  </g>

  <!-- Typography -->
  <g transform="translate(78, 22)">
    <!-- Hindi "वाणी" in Terracotta -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Noto Sans Devanagari', 'Inter', sans-serif" font-weight="800" font-size="24" fill="#C85A32" letter-spacing="0.5">वाणी</text>
    <!-- Separator -->
    <text x="52" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="24" fill="#2C3E34">-</text>
    <!-- English "SHIKSHA AI" in Deep Forest Green -->
    <text x="64" y="24" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="24" fill="#145A32" letter-spacing="1">SHIKSHA <tspan fill="#C85A32" font-size="16" font-weight="800">AI</tspan></text>
    
    <!-- Subtitle Badge -->
    <text x="1" y="42" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="8.5" fill="#5A6E63" letter-spacing="1.5">OFFLINE AI TEACHING ASSISTANT</text>
  </g>
</svg>
