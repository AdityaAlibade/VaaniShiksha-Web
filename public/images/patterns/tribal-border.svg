<svg xmlns="http://www.w3.org/2000/svg" width="120" height="24" viewBox="0 0 120 24" fill="none">
  <!-- Repeatable Tribal Geometric Motif -->
  <!-- Top line -->
  <line x1="0" y1="2" x2="120" y2="2" stroke="#C85A32" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Stepped Chevron Triangles -->
  <polygon points="10,6 20,18 0,18" fill="#145A32" fill-opacity="0.15"/>
  <polygon points="10,9 17,17 3,17" fill="#C85A32" fill-opacity="0.25"/>
  
  <polygon points="40,6 50,18 30,18" fill="#145A32" fill-opacity="0.15"/>
  <polygon points="40,9 47,17 33,17" fill="#C85A32" fill-opacity="0.25"/>

  <polygon points="70,6 80,18 60,18" fill="#145A32" fill-opacity="0.15"/>
  <polygon points="70,9 77,17 63,17" fill="#C85A32" fill-opacity="0.25"/>

  <polygon points="100,6 110,18 90,18" fill="#145A32" fill-opacity="0.15"/>
  <polygon points="100,9 107,17 93,17" fill="#C85A32" fill-opacity="0.25"/>

  <!-- Diamonds between -->
  <polygon points="25,9 29,13 25,17 21,13" fill="#D35400" fill-opacity="0.4"/>
  <polygon points="55,9 59,13 55,17 51,13" fill="#D35400" fill-opacity="0.4"/>
  <polygon points="85,9 89,13 85,17 81,13" fill="#D35400" fill-opacity="0.4"/>
  <polygon points="115,9 119,13 115,17 111,13" fill="#D35400" fill-opacity="0.4"/>

  <!-- Bottom baseline -->
  <line x1="0" y1="22" x2="120" y2="22" stroke="#145A32" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>
